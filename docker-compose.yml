services:
  postgres:
    image: postgres:15-alpine
    container_name: orderservice-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: katusha
      POSTGRES_PASSWORD: katusha
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - orderservice-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U katusha -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  orderservice:
    build:
      context: .
      dockerfile: orderservice/Dockerfile
    container_name: orderservice-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
      SPRING_DATASOURCE_USERNAME: katusha
      SPRING_DATASOURCE_PASSWORD: katusha
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: orderservice
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_LIQUIBASE_ENABLED: "true"
      SPRING_LIQUIBASE_DEFAULT_SCHEMA: orderservice
      SPRING_LIQUIBASE_CHANGE_LOG: classpath:db/changelog/db.changelog-master.yml
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      USER_SERVICE_BASE_URL: ${USER_SERVICE_BASE_URL:-http://userservice:8081}
      JWT_SECRET: ${JWT_SECRET:-231962b41fccd0163cb87032579b0185}
    ports:
      - "${APPLICATION_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - orderservice-network

networks:
  orderservice-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local