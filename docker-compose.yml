services:
  # DATABASES
  postgres-auth:
    image: postgres:15-alpine
    container_name: auth-postgres
    environment:
      POSTGRES_DB: authservice
      POSTGRES_USER: katusha
      POSTGRES_PASSWORD: katusha
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5433:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
      - ./init_auth.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U katusha -d authservice"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  postgres-user:
    image: postgres:15-alpine
    container_name: user-postgres
    environment:
      POSTGRES_DB: userservice
      POSTGRES_USER: katusha
      POSTGRES_PASSWORD: katusha
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5434:5432"
    volumes:
      - user-postgres-data:/var/lib/postgresql/data
      - ./init_user.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U katusha -d userservice"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  postgres-order:
    image: postgres:15-alpine
    container_name: order-postgres
    environment:
      POSTGRES_DB: orderservice
      POSTGRES_USER: katusha
      POSTGRES_PASSWORD: katusha
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5435:5432"
    volumes:
      - order-postgres-data:/var/lib/postgresql/data
      - ./init_order.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U katusha -d orderservice"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  #REDIS
  redis:
    image: redis:7-alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command: redis-server --appendonly yes

  #MICROSERVICES
  auth-service:
    build:
      context: .
      dockerfile: authService/Dockerfile
    container_name: auth-service
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/authservice
      SPRING_DATASOURCE_USERNAME: katusha
      SPRING_DATASOURCE_PASSWORD: katusha
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_LIQUIBASE_ENABLED: "true"
      JWT_SECRET: 231962b41fccd0163cb87032579b0185
      JWT_ACCESS_TOKEN_EXPIRATION: 3600000
      JWT_REFRESH_TOKEN_EXPIRATION: 86400000
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      LOGGING_LEVEL_BY_RUBLEVSKAYA_AUTHSERVICE: INFO
      SPRING_AUTOCONFIGURE_EXCLUDE: "org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration"
    ports:
      - "8082:8080"
    networks:
      - microservices-network
    depends_on:
      postgres-auth:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: UserService/Dockerfile
    container_name: user-service
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-user:5432/userservice
      SPRING_DATASOURCE_USERNAME: katusha
      SPRING_DATASOURCE_PASSWORD: katusha
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_LIQUIBASE_ENABLED: "true"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: 231962b41fccd0163cb87032579b0185
      LOGGING_LEVEL_BY_RUBLEVSKAYA_USERSERVICE: INFO
      SPRINGDOC_OPENAPI_DEV_URL: http://localhost:8081
      SPRING_AUTOCONFIGURE_EXCLUDE: "org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration"
    ports:
      - "8081:8080"
    networks:
      - microservices-network
    depends_on:
      postgres-user:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  order-service:
    build:
      context: .
      dockerfile: orderservice/Dockerfile
    container_name: order-service
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-order:5432/orderservice
      SPRING_DATASOURCE_USERNAME: katusha
      SPRING_DATASOURCE_PASSWORD: katusha
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_LIQUIBASE_ENABLED: "true"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      USER_SERVICE_BASE_URL: http://user-service:8080
      JWT_SECRET: 231962b41fccd0163cb87032579b0185
      LOGGING_LEVEL_BY_RUBLEVSKAYA_ORDERSERVICE: INFO
      SPRINGDOC_OPENAPI_DEV_URL: http://localhost:8080
      SPRING_AUTOCONFIGURE_EXCLUDE: "org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration"
    ports:
      - "8080:8080"
    networks:
      - microservices-network
    depends_on:
      postgres-order:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: apigateway/Dockerfile
    container_name: api-gateway
    environment:
      SERVER_PORT: 8083
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: 231962b41fccd0163cb87032579b0185
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration

      URLS_AUTH_SERVICE: http://auth-service:8080
      URLS_USER_SERVICE: http://user-service:8080
      URLS_ORDER_SERVICE: http://order-service:8080

      SPRING_CLOUD_GATEWAY_ROUTES_0_ID: auth-service
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: http://auth-service:8080
      SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0: Path=/auth/**

      SPRING_CLOUD_GATEWAY_ROUTES_1_ID: user-service
      SPRING_CLOUD_GATEWAY_ROUTES_1_URI: http://user-service:8080
      SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0: Path=/users/**,/cards/**

      SPRING_CLOUD_GATEWAY_ROUTES_2_ID: order-service
      SPRING_CLOUD_GATEWAY_ROUTES_2_URI: http://order-service:8080
      SPRING_CLOUD_GATEWAY_ROUTES_2_PREDICATES_0: Path=/api/v1/orders/**

      SPRING_CLOUD_GATEWAY_ROUTES_3_ID: openapi-auth
      SPRING_CLOUD_GATEWAY_ROUTES_3_URI: http://auth-service:8080
      SPRING_CLOUD_GATEWAY_ROUTES_3_PREDICATES_0: Path=/v3/api-docs/auth
      SPRING_CLOUD_GATEWAY_ROUTES_3_FILTERS_0: RewritePath=/v3/api-docs/auth, /v3/api-docs

      SPRING_CLOUD_GATEWAY_ROUTES_4_ID: openapi-user
      SPRING_CLOUD_GATEWAY_ROUTES_4_URI: http://user-service:8080
      SPRING_CLOUD_GATEWAY_ROUTES_4_PREDICATES_0: Path=/v3/api-docs/user
      SPRING_CLOUD_GATEWAY_ROUTES_4_FILTERS_0: RewritePath=/v3/api-docs/user, /v3/api-docs

      SPRING_CLOUD_GATEWAY_ROUTES_5_ID: openapi-order
      SPRING_CLOUD_GATEWAY_ROUTES_5_URI: http://order-service:8080
      SPRING_CLOUD_GATEWAY_ROUTES_5_PREDICATES_0: Path=/v3/api-docs/order
      SPRING_CLOUD_GATEWAY_ROUTES_5_FILTERS_0: RewritePath=/v3/api-docs/order, /v3/api-docs

      SPRINGDOC_API_DOCS_PATH: /v3/api-docs
      SPRINGDOC_SWAGGER_UI_PATH: /swagger-ui.html
      SPRINGDOC_SWAGGER_UI_ENABLED: "true"
      SPRINGDOC_SWAGGER_UI_URLS_0_NAME: API Gateway
      SPRINGDOC_SWAGGER_UI_URLS_0_URL: /v3/api-docs
      SPRINGDOC_SWAGGER_UI_URLS_1_NAME: Auth Service
      SPRINGDOC_SWAGGER_UI_URLS_1_URL: /v3/api-docs/auth
      SPRINGDOC_SWAGGER_UI_URLS_2_NAME: User Service
      SPRINGDOC_SWAGGER_UI_URLS_2_URL: /v3/api-docs/user
      SPRINGDOC_SWAGGER_UI_URLS_3_NAME: Order Service
      SPRINGDOC_SWAGGER_UI_URLS_3_URL: /v3/api-docs/order

      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_GATEWAY: INFO
    ports:
      - "8083:8083"
    networks:
      - microservices-network
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test: "wget --no-verbose --tries=1 --spider http://localhost:8083/actuator/health || exit 1"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  auth-postgres-data:
    driver: local
  user-postgres-data:
    driver: local
  order-postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  microservices-network:
    driver: bridge
    name: microservices-network