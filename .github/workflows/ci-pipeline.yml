name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write
env:
  JAVA_VERSION: '21'
  DOCKER_IMAGE_NAME: userservice
  DOCKER_REGISTRY: ghcr.io
  MAVEN_OPTS: -Xmx1024m -XX:MaxMetaspaceSize=512m

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Display project structure
        run: |
          echo "Project structure:"
          find . -name "pom.xml" -type f | head -10
          echo ""
          echo "Root pom.xml exists:"
          ls -la pom.xml || echo "No root pom.xml"

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build with Maven (skip problematic modules)
        run: |
          echo "Building multi-module project..."
          # Собираем проект, пропуская проблемный модуль task_3
          mvn clean compile -DskipTests \
            -pl !task_3 \
            --batch-mode --errors
        continue-on-error: false

      - name: Run Tests (UserService module only)
        run: |
          echo "Running tests for UserService module..."
          mvn test -pl UserService \
            --batch-mode --errors
        continue-on-error: true

      - name: Generate Test Report
        if: always()
        uses: dorny/test-reporter@v1
        continue-on-error: true
        with:
          name: Maven Tests
          path: '**/target/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: test-results
          path: '**/target/surefire-reports/'

      - name: Save module info
        run: |
          echo "UserService" > module-name.txt
          echo "UserService module for Docker build"

      - name: Upload module info
        uses: actions/upload-artifact@v4
        with:
          name: module-info
          path: module-name.txt

  code-analysis:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Set up JDK ${{ env.JAVA_VERSION }}"
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and analyze with SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "Running SonarQube analysis on UserService module..."
          mvn clean verify sonar:sonar \
            -pl UserService -am \
            -Dsonar.projectKey=graffegiraffe_innowice_internship_kate_rublevskaya \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.java.coveragePlugin=jacoco \
            -Dsonar.coverage.jacoco.xmlReportPaths=UserService/target/site/jacoco/jacoco.xml \
            --batch-mode --errors
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [build, code-analysis]
    if: github.event_name == 'push'
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build UserService module
        run: |
          echo "Building UserService module for Docker..."
          mvn clean package -pl UserService -am -DskipTests \
            --batch-mode --errors
          echo "Checking for JAR file:"
          ls -lh UserService/target/*.jar

      - name: Check for Dockerfile
        run: |
          if [ -f "UserService/Dockerfile" ]; then
            echo "Dockerfile found in UserService/"
          else
            echo "Dockerfile not found in UserService/"
            echo "Creating Dockerfile..."
            cat > UserService/Dockerfile << 'EOF'
          FROM maven:3.9.5-eclipse-temurin-21-alpine AS build
          WORKDIR /app
          COPY pom.xml /app/pom.xml
          RUN mkdir -p /app/UserService
          COPY UserService/pom.xml /app/UserService/pom.xml
          WORKDIR /app/UserService
          RUN mvn dependency:go-offline -B || true
          COPY UserService/src /app/UserService/src
          RUN mvn clean package -DskipTests
          FROM eclipse-temurin:21-jre-alpine
          WORKDIR /app
          RUN addgroup -S spring && adduser -S spring -G spring
          USER spring:spring
          COPY --from=build /app/UserService/target/*.jar app.jar
          EXPOSE 8080
          HEALTHCHECK --interval=30s --timeout=3s --start-period=40s --retries=3 \
          CMD wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1
          ENTRYPOINT ["java", "-jar", "/app/app.jar"]
          EOF
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.actor }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./UserService/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: 'echo "Image digest: ${{ steps.meta.outputs.digest }}"'

  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: [build, code-analysis, docker-build]
    if: always()

    steps:
      - name: Check job status
        run: |
          echo "=========================================="
          echo "Pipeline Execution Summary"
          echo "=========================================="
          echo "Build and Test: ${{ needs.build.result }}"
          echo "Code Analysis: ${{ needs.code-analysis.result }}"
          echo "Docker Build: ${{ needs.docker-build.result }}"
          echo "=========================================="
          
          if [ "${{ needs.build.result }}" == "success" ]; then
            if [ "${{ needs.code-analysis.result }}" == "success" ] || [ "${{ needs.code-analysis.result }}" == "skipped" ]; then
              if [ "${{ needs.docker-build.result }}" == "success" ] || [ "${{ needs.docker-build.result }}" == "skipped" ]; then
                echo "All jobs completed successfully"
                exit 0
              fi
            fi
          fi
          
          echo "Some jobs failed"
          exit 1