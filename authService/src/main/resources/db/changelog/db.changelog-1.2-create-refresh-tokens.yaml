databaseChangeLog:
  - changeSet:
      id: 3
      author: katusha
      changes:
        - createTable:
            tableName: refresh_tokens
            schemaName: authservice
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: token
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: expiry_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_refresh_tokens_user_id
            tableName: refresh_tokens
            schemaName: authservice
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: idx_refresh_tokens_expiry_date
            tableName: refresh_tokens
            schemaName: authservice
            columns:
              - column:
                  name: expiry_date