databaseChangeLog:
  - changeSet:
      id: 002-add-orders-indexes
      author: dev_project
      comment: "Add indexes for faster search on orders table"
      changes:
        - createIndex:
            indexName: idx_orders_user_id
            tableName: orders
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: idx_orders_status
            tableName: orders
            columns:
              - column:
                  name: status